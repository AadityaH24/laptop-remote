<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>Laptop Remote</title>
<base href="/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="static/style.css?v=12">
</head>
<body>

<div class="top">
<header class="bar">
  <div class="brand">
    <span class="dot" id="dot" title="connecting"></span>
    <span class="host" id="host">Laptop</span>
  </div>
  <button class="icon" id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.2A1.7 1.7 0 0 0 4.6 8a1.7 1.7 0 0 0-.4-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1Z"/></svg>
  </button>
</header>

<!-- Deck tiles: built from /api/layout, never hardcoded here. -->
<nav class="deck" id="deck" aria-label="Controls"></nav>
</div>

<main id="main"></main>

<div class="toast" id="toast" role="status"></div>

<!-- widget templates ---------------------------------------------------- -->
<template id="tpl-nowplaying">
  <section class="card media" data-w>
    <div class="session-list"></div>
    <div class="empty" hidden>
      <div class="art"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></div>
      <div class="meta">
        <div class="title">&nbsp;</div>
        <div class="sub">&nbsp;</div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-media-session">
  <div class="session" role="group">
    <div class="art"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></div>
    <div class="meta">
      <div class="line">
        <span class="title">&nbsp;</span>
        <span class="app"></span>
      </div>
      <div class="sub"></div>
    </div>
    <div class="seek" hidden>
      <div class="progress" role="slider" aria-label="Seek" aria-valuemin="0">
        <div class="track"><div class="bar"></div></div>
        <div class="knob"></div>
        <div class="seek-hint" hidden>0:00</div>
      </div>
      <div class="times"><span class="pos">0:00</span><span class="dur">0:00</span></div>
    </div>
    <div class="transport">
      <button class="icon" data-media="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5v14M20 5 9 12l11 7V5Z"/></svg></button>
      <button class="icon skip" data-media="back10" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="16.6" text-anchor="middle" font-size="7.2" font-weight="700" stroke="none">10</text></svg></button>
      <button class="icon play" data-media="toggle" aria-label="Play or pause"><svg viewBox="0 0 24 24" class="playIcon"><path d="M8 5v14l11-7L8 5Z"/></svg></button>
      <button class="icon skip" data-media="fwd10" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="16.6" text-anchor="middle" font-size="7.2" font-weight="700" stroke="none">10</text></svg></button>
      <button class="icon" data-media="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M18 5v14M4 5l11 7L4 19V5Z"/></svg></button>
      <button class="icon stop" data-media="stop" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
    </div>
  </div>
</template>

<template id="tpl-volume">
  <section class="card" data-w>
    <div class="row">
      <div class="label">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg>
        <span>Volume</span>
      </div>
      <div class="row-end">
        <output>--</output>
        <button class="chip" data-mute aria-pressed="false">Mute</button>
      </div>
    </div>
    <input type="range" min="0" max="100" step="1" value="50" aria-label="Volume">
  </section>
</template>

<template id="tpl-brightness">
  <section class="card" data-w>
    <div class="row">
      <div class="label">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
        <span>Brightness</span>
      </div>
      <output>--</output>
    </div>
    <input type="range" min="1" max="100" step="1" value="50" aria-label="Brightness">
  </section>
</template>

<template id="tpl-lock">
  <section class="card" data-w>
    <div class="label tight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      <span>Power</span>
    </div>
    <div class="grid3" data-power></div>
  </section>
</template>

<template id="tpl-audio">
  <section class="card" data-w>
    <div class="label tight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <span>Audio output</span>
    </div>
    <ul class="audio-list" data-outputs></ul>
  </section>
</template>

<template id="tpl-apps">
  <section class="card" data-w>
    <div class="label tight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Launch</span>
    </div>
    <div class="apps" data-apps></div>
  </section>
</template>

<template id="tpl-windows">
  <section class="card" data-w>
    <div class="row">
      <div class="label">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><path d="M6.5 6.5h.01M9.5 6.5h.01"/></svg>
        <span>Open windows</span>
      </div>
      <div class="row-end">
        <span class="win-count" data-win-count></span>
        <button class="chip" data-win-refresh>Refresh</button>
      </div>
    </div>
    <div class="win-list" data-windows>
      <span class="empty">Loading…</span>
    </div>
  </section>
</template>

<template id="tpl-touchpad">
  <section class="card pad-card" data-w>
    <div class="row pad-head">
      <div class="label">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M12 6.5v5"/></svg>
        <span>Touchpad</span>
      </div>
      <div class="row-end">
        <button class="chip" data-pad-toggle aria-pressed="true">On</button>
        <button class="chip" data-scroll-dir aria-pressed="true">Natural</button>
      </div>
    </div>
    <div class="pad" data-pad>
      <span class="pad-hint">Drag to move · tap to click · two fingers to scroll</span>
    </div>
  </section>
</template>

<template id="tpl-clickbar">
  <section class="card clickbar" data-w>
    <button class="click" data-click="left" aria-label="Left click">Left click</button>
    <button class="click" data-click="right" aria-label="Right click">Right click</button>
  </section>
</template>

<template id="tpl-shortcuts">
  <section class="card keys-card" data-w>
    <div class="label tight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7.5 14h9"/></svg>
      <span>Shortcuts</span>
    </div>
    <div class="keys" data-keys></div>
  </section>
</template>

<template id="tpl-typebar">
  <section class="card" data-w>
    <div class="label tight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 9.5h.01M9.5 9.5h.01M13 9.5h.01M16.5 9.5h.01M6 12.8h.01M9.5 12.8h.01M13 12.8h.01M16.5 12.8h.01M7 15.5h10"/></svg>
      <span>Type on laptop</span>
    </div>
    <div class="typebar-row">
      <input type="text" data-field maxlength="500" placeholder="Text to type…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
      <button class="chip send" data-send aria-label="Send text">Send</button>
      <button class="chip send" data-send-enter aria-label="Send text and press Enter">↵</button>
    </div>
  </section>
</template>

<!-- pairing ------------------------------------------------------------ -->
<div class="overlay" id="pairOverlay" hidden>
  <div class="sheet">
    <h1>Pair this device</h1>
    <p class="muted">Type the 6-digit PIN shown in the terminal on your laptop. You only do this once.</p>
    <label class="field">
      <span>PIN</span>
      <input id="pinInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    </label>
    <label class="field">
      <span>Device name</span>
      <input id="nameInput" maxlength="40">
    </label>
    <button class="primary" id="pairBtn">Pair</button>
    <p class="err" id="pairErr"></p>
  </div>
</div>

<!-- settings ----------------------------------------------------------- -->
<div class="overlay" id="settingsOverlay" hidden>
  <div class="sheet">
    <h1>Settings</h1>
    <div class="statline" id="statline"></div>
    <h2>Paired devices</h2>
    <ul class="devices" id="deviceList"></ul>
    <button class="ghost" id="forgetBtn">Forget this device</button>
    <button class="primary" id="closeSettings">Done</button>
  </div>
</div>

<script src="static/app.js?v=12"></script>
</body>
</html>
